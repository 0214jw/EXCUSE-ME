<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <title>EXCUSE ME! original walnut exhibition frame</title>
  <desc>Original vector artwork: four walnut rails, mitred corners, raised outer bead and recessed inner moulding. No external images.</desc>
  <defs>
    <linearGradient id="top" x2="0" y2="1">
      <stop stop-color="#241a14"/><stop offset=".035" stop-color="#755942"/>
      <stop offset=".08" stop-color="#b08a63"/><stop offset=".13" stop-color="#5f4532"/>
      <stop offset=".2" stop-color="#2c2019"/><stop offset=".26" stop-color="#6a4c34"/>
      <stop offset=".42" stop-color="#75543a"/><stop offset=".59" stop-color="#573b29"/>
      <stop offset=".7" stop-color="#342419"/><stop offset=".76" stop-color="#251b15"/>
      <stop offset=".82" stop-color="#906b47"/><stop offset=".86" stop-color="#b49167"/>
      <stop offset=".9" stop-color="#674830"/><stop offset=".96" stop-color="#39271c"/>
      <stop offset="1" stop-color="#1c1511"/>
    </linearGradient>
    <linearGradient id="bottom" x2="0" y2="1">
      <stop stop-color="#1d1510"/><stop offset=".06" stop-color="#9e7b54"/>
      <stop offset=".12" stop-color="#6b4b32"/><stop offset=".19" stop-color="#38271c"/>
      <stop offset=".26" stop-color="#201812"/><stop offset=".4" stop-color="#4a3324"/>
      <stop offset=".61" stop-color="#5c3f2a"/><stop offset=".74" stop-color="#35241a"/>
      <stop offset=".82" stop-color="#231a14"/><stop offset=".88" stop-color="#896744"/>
      <stop offset=".94" stop-color="#4b3324"/><stop offset="1" stop-color="#1b1410"/>
    </linearGradient>
    <linearGradient id="left" x2="1" y2="0" href="#top"/>
    <linearGradient id="right" x2="1" y2="0" href="#bottom"/>
    <filter id="horizontal-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .34" numOctaves="3" seed="24"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="vertical-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".34 .012" numOctaves="3" seed="24"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="top-rail"><path d="M0 0H600L488 112H112Z"/></clipPath>
    <clipPath id="bottom-rail"><path d="M0 600H600L488 488H112Z"/></clipPath>
    <clipPath id="left-rail"><path d="M0 0V600L112 488V112Z"/></clipPath>
    <clipPath id="right-rail"><path d="M600 0V600L488 488V112Z"/></clipPath>
  </defs>
  <g clip-path="url(#top-rail)"><path fill="url(#top)" filter="url(#horizontal-grain)" d="M0 0H600V112H0Z"/></g>
  <g clip-path="url(#bottom-rail)"><path fill="url(#bottom)" filter="url(#horizontal-grain)" d="M0 488H600V600H0Z"/></g>
  <g clip-path="url(#left-rail)"><path fill="url(#left)" filter="url(#vertical-grain)" d="M0 0H112V600H0Z"/></g>
  <g clip-path="url(#right-rail)"><path fill="url(#right)" filter="url(#vertical-grain)" d="M488 0H600V600H488Z"/></g>
  <path d="M2 2L112 112M598 2L488 112M2 598L112 488M598 598L488 488" stroke="#140e0a" stroke-opacity=".65" stroke-width="1.5"/>
  <path d="M4 2L114 112M596 2L486 112M4 598L114 488M596 598L486 488" stroke="#d2ae80" stroke-opacity=".2"/>
  <path d="M4 596V4H596" fill="none" stroke="#e7c494" stroke-opacity=".26" stroke-width="2"/>
  <path d="M596 4V596H4" fill="none" stroke="#0f0a08" stroke-opacity=".8" stroke-width="4"/>
  <path d="M111 488V111H488" fill="none" stroke="#100c09" stroke-opacity=".8" stroke-width="3"/>
  <path d="M488 111V488H111" fill="none" stroke="#d5b58a" stroke-opacity=".65" stroke-width="2"/>
</svg>
